[package]
name = "kolomoni"
description = "Backend system for the Stari Kolomoni fantasy translation project."
license-file = "LICENSE.md"
version = "0.1.0"
edition = "2021"
authors = ["Grimpy101 <gorupgorazd@gmail.com>", "Simon Goričar <simon.peter.goricar@gmail.com>"]
rust-version = "1.65.0"
publish = false


[workspace]
members = [
    "kolomoni_api_client",
    "kolomoni_configuration",
    "kolomoni_core",
    "kolomoni_database",
    "kolomoni_migrations",
    "kolomoni_migrations_core",
    "kolomoni_migrations_macros",
    "kolomoni_openapi",
    "kolomoni_seeder",
    "kolomoni_search_core",
    "kolomoni_search",
    "kolomoni_test_core",
    "kolomoni_test_macros",
    "kolomoni_test",
    "kolomoni_cache",
]


[workspace.dependencies]
clap = { version = "^4.5.31", features = ["derive"] }

tokio = { version = "^1.44.0", features = ["full"] }

serde = { version = "^1.0.218", features = ["derive"] }
serde_with = { version = "^3.12.0", features = ["chrono_0_4"] }
serde_json = "^1.0.140"
toml = "^0.8.20"

miette = "^7.5.0"
thiserror = "^2.0.12"
tracing = "^0.1.41"
tracing-subscriber = { version = "^0.3.19", features = ["env-filter"] }
tracing-appender = "^0.2.3"
tracing-actix-web = "^0.7.16"
dunce = "^1.0.5"

actix-web = "^4.9.0"
actix-http = "^3.9.0"
actix-utils = "^3.0.1"
actix-cors = "^0.7.0"
actix-service = "^2.0.2"


syn = "^2.0.99"
quote = "^1.0.39"
proc-macro-error2 = "^2.0.1"
proc-macro2 = "^1.0.94"
paste = "^1.0.15"


# The patched version contains some additional merging functionality that helps us make better documentation.
# utoipa = { version = "4.2.0", features = ["actix_extras", "chrono", "preserve_order"] }
# utoipa-rapidoc = { version = "3.0.0", features = ["actix-web"] }
utoipa = { git = "https://github.com/simongoricar/utoipa.git", rev = "fce3e3a1f1c6dede38eab8965ddf074a47196752", features = ["actix_extras", "chrono", "uuid", "preserve_order"] }
utoipa-rapidoc = { git = "https://github.com/simongoricar/utoipa.git", rev = "fce3e3a1f1c6dede38eab8965ddf074a47196752", features = ["actix-web"] }

itertools = "^0.14.0"

argon2 = "^0.5.3"
sha2 = "^0.10.8"

jsonwebtoken = "^9.3.1"
chrono = "^0.4.40"

# TODO We'll have to bump this at some point, I think the blocker was with actix-web using this version of `http`.
http = "^0.2.12"
url = "^2.5.4"

mime = "^0.3.17"
uuid = { version = "^1.15.1", features = ["v7", "serde"] }
httpdate = "^1.0.3"
bytes = "^1.10.1"
dotenvy = "^0.15.7"
csv = "1.3.1"
assert_matches = "1.5.0"

reqwest = { version = "^0.13.2", default-features = false }

# The patched version contains the PR for scoring fuzzy results according to Levenshtein distance.
# (see <https://github.com/paradedb/tantivy/pull/1>)
# tantivy = "^0.24.0"
tantivy = { git = "https://github.com/Stari-kolomoni/tantivy.git", rev = "e97f5e17fd8d2aa93a011adbea547ba2e3dec8ce" }

slotmap = "^1.0.7"

fastrand = "^2.3.0"

ctrlc = "^3.4.0"

pathdiff = "^0.2.3"
path-slash = "^0.2.1"

parking_lot = { version = "^0.12.3", features = ["arc_lock"] }

fs-more = "^0.8.0"

maplit = "^1.0.2"

futures-core = "^0.3.31"
futures-util = "^0.3.31"
pin-project-lite = "^0.2.16"

crossbeam-channel = "^0.5.14"



[workspace.dependencies.sqlx]
version = "^0.8.3"	
features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "uuid",
    "chrono",
    "json"
]



[[bin]]
name = "kolomoni"
path = "./kolomoni/src/main.rs"

[lib]
path = "./kolomoni/src/lib.rs"



[dependencies]
kolomoni_core = { path = "./kolomoni_core" }
kolomoni_migrations = { path = "./kolomoni_migrations" }
kolomoni_configuration = { path = "./kolomoni_configuration" }
kolomoni_database = { path = "./kolomoni_database" }
kolomoni_cache = { path = "./kolomoni_cache" }
kolomoni_search = { path = "./kolomoni_search" }

clap = { workspace = true }

thiserror = { workspace = true }
miette = { workspace = true, features = ["fancy"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
tracing-actix-web = { workspace = true }

serde = { workspace = true }
serde_with = { workspace = true }
serde_json = { workspace = true }

tokio = { workspace = true }

ctrlc = { workspace = true }

actix-web = { workspace = true }
actix-http = { workspace = true }
actix-utils = { workspace = true }
actix-cors = { workspace = true }

utoipa = { workspace = true }

sqlx = { workspace = true }

dunce = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }

itertools = { workspace = true }
parking_lot = { workspace = true }
mime = { workspace = true }
httpdate = { workspace = true }
futures-util = { workspace = true }
paste = { workspace = true }



[features]
# Enables a special set of endpoints that are used when doing end-to-end tests.
# THIS MUST NOT BE ENABLED IN PRODUCTION, OTHERWISE THE ENTIRE APP IS INCREDIBLY VULNERABLE.
e2e-testing = ["kolomoni_core/e2e-testing"]


[profile.dev.build-override]
opt-level = 3

